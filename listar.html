<body>

    <main>
        <nav>

            <a href="cadastrar.html">CADASTRAR</a>

        </nav>

        <div id="conteudo">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                </tr>
                <tbody id="clientes"></tbody>
                <tr>
                    <td>01</td>
                    <td>Yuri Tiggemann</td>
                    <td>51 999626981</td>
                    <td>yuri.tiggemann09@gmail.com</td>
                </tr>

    </main>
    <script>

        const url = "https://infosulst.com.br/univates/web/cliente/"
        const token = "Bearer meu-token-secreto-123"

        async function buscar(){

            const resposta = await fetch(
                url, {
                    headers: {
                        'Authorization': token
                    }
                }
            )
            const clientes = await resposta.json();
            console.log(clientes);
            let linhas = ''

            for(const cliente of clientes){
                linhas += '<tr>' +
                            '<td>' + cliente.id + '</td>' +
                            '<td>' + cliente.nome + '</td>' +
                            '<td>' + cliente.nome + '</td>' +
                            '<td>' + cliente.email + '</td>' +
                          '</tr>'  
            }
            document.getElementById('clientes').innerHTML = linhas
            console.log(linhas)
        }

        buscar()
        
    </script>
</body>
